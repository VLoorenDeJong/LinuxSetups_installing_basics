<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GrapesJS</title>
  <link rel="stylesheet" href="grapesjs/css/grapes.min.css">
  <style>
    html, body { margin: 0; height: 100%; }
    #gjs { height: 100vh; }
    #pages { position: fixed; top: 6px; left: 120px; z-index: 10; font: 13px sans-serif; }
  </style>
</head>
<body>
  <select id="pages" title="Page"></select>
  <div id="gjs"></div>
  <script src="grapesjs/grapes.min.js"></script>
  <script src="blocks/index.js"></script>
  <script>
    // Saved on the machine, in data/ (nginx PUT): project.json is what the
    // editor reloads, export.json is every page as HTML for upstream transfers.
    const slug = s => (s || 'page').toLowerCase().normalize('NFKD')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'page';

    function exportPages(ed) {
      return ed.Pages.getAll().map((p, i) => {
        const c = p.getMainComponent();
        const title = p.getName() || p.get('name') || (i === 0 ? 'Home' : 'Page ' + (i + 1));
        return { title, slug: slug(title), order: i, html: ed.getHtml({ component: c }), css: ed.getCss({ component: c }) };
      });
    }

    function serverStorage(ed) {
      ed.Storage.add('server', {
        async load() {
          const r = await fetch('data/project.json', { cache: 'no-store' });
          return r.ok ? r.json() : {};
        },
        async store(data) {
          await fetch('data/project.json', { method: 'PUT', body: JSON.stringify(data) });
          await fetch('data/export.json', { method: 'PUT', body: JSON.stringify({ pages: exportPages(ed) }) });
        },
      });
    }

    const blocks = window['gjs-blocks-basic'].default || window['gjs-blocks-basic'];
    const editor = grapesjs.init({
      container: '#gjs',
      height: '100vh',
      plugins: [serverStorage, blocks],
      storageManager: { type: 'server', autosave: true, autoload: true, stepsBeforeSave: 1 },
    });

    const select = document.getElementById('pages');
    function listPages() {
      select.innerHTML = '';
      editor.Pages.getAll().forEach((p, i) => {
        const o = document.createElement('option');
        o.value = p.getId();
        o.textContent = p.getName() || p.get('name') || 'Page ' + (i + 1);
        o.selected = p === editor.Pages.getSelected();
        select.appendChild(o);
      });
    }
    select.onchange = () => editor.Pages.select(select.value);
    editor.on('load page', listPages);
  </script>
</body>
</html>
