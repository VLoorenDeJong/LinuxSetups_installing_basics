# GrapesJS, the page-builder library Silex is built on. https://github.com/GrapesJS/grapesjs
#
# A puzzle piece: the format is in upstream/README.md. A library has no server,
# so the Dockerfile here wraps it in one page and a save location. Pages are saved on the
# machine, in its data folder, through a PUT-only location in nginx.

UPSTREAM       = https://github.com/GrapesJS/grapesjs.git
RELEASE_RULE   = npm
PACKAGE        = grapesjs
SOURCE         = recipe
CONTAINER_PORT = 8080
HEALTH_PATH    = /

# The editor saves here through nginx (default.conf): project.json and export.json.
MOUNT = data:/usr/share/nginx/html/data

# Confinement (upstream/README.md). nginx runs whole as a uid no host account
# has, so it needs no capabilities; it writes only its cache and pid file,
# kept in memory and open to that uid.
USER     = 10003:10003
WRITABLE = /var/cache/nginx:mode=1777 /var/run:mode=1777

