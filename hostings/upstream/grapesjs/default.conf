server {
    listen       8080;
    listen  [::]:8080;
    root   /usr/share/nginx/html;
    index  index.html;

    # The editor's saves. PUT is the only write, and only here.
    location /data/ {
        dav_methods         PUT;
        create_full_put_path on;
        client_max_body_size 50m;
        limit_except GET PUT { deny all; }
        add_header Cache-Control "no-store";
    }
}
