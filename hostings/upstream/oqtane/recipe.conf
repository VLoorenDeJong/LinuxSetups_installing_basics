# Oqtane, a CMS built on Blazor. https://github.com/oqtane/oqtane.framework
#
# A puzzle piece: the format is in upstream/README.md. Installs itself on first
# start from the settings below, so nobody has to click through its wizard.

UPSTREAM       = https://github.com/oqtane/oqtane.framework.git
RELEASE_RULE   = github-stable
SOURCE         = recipe
CONTAINER_PORT = 8080
HEALTH_PATH    = /
HEALTH_WAIT    = 300

MOUNT = data:/app/Data
MOUNT = content:/app/Content

ENV = Database__DefaultDBType=Oqtane.Database.Sqlite.SqliteDatabase, Oqtane.Server
ENV = ConnectionStrings__DefaultConnection=Data Source=/app/Data/Oqtane.db;
# Every address the row answers on, preview port included, or Oqtane sends a
# visitor on an address it does not know to the one it does.
ENV = Installation__DefaultAlias={HOSTS}
ENV = Installation__HostEmail=host@{PUBLIC_HOST}

# The host account's password. sudo cat /etc/upstream/app-<row><suffix>.env
SECRET = Installation__HostPassword
# Only the install reads it; after that it would sit in docker inspect.
SECRET_UNTIL = data/Oqtane.db

# Confinement (upstream/README.md). Oqtane writes appsettings.json and its
# installed modules into /app itself, so its filesystem cannot be read-only.
READ_ONLY = no
# A uid no host account has; the Dockerfile gives it /app.
USER = 10002:10002

# Signing in calls the site's own address from inside the container, so the
# wall in upstream_net.sh opens for 443 and the preview port.
SELF_CALL = yes

# Oqtane caches its pages, so a transfer restarts it.
TRANSFER_RESTART = yes

# The host account goes into the secret store as a login: <SECRET> <username>.
LOGIN = Installation__HostPassword host
