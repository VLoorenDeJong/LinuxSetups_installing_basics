# Silex, the visual website builder. https://github.com/silexlabs/Silex
#
# A puzzle piece: everything the server needs to know about this package, and
# nothing else. The format is in upstream/README.md.

UPSTREAM       = https://github.com/silexlabs/Silex.git
RELEASE_RULE   = github-stable
SOURCE         = upstream
DOCKERFILE     = Dockerfile
CONTAINER_PORT = 8080
HEALTH_PATH    = /
HEALTH_WAIT    = 180

# Sites being edited, and what Publish writes.
MOUNT = storage:/data/storage
MOUNT = hosting:/data/hosting

ENV = SILEX_PORT=8080
# Their Dockerfile defaults both to ftp, which asks every user for an FTP login.
ENV = STORAGE_CONNECTORS=fs
ENV = HOSTING_CONNECTORS=fs
ENV = SILEX_FS_ROOT=/data/storage
ENV = SILEX_FS_HOSTING_ROOT=/data/hosting
ENV = SILEX_URL={PUBLIC_URL}

SECRET = SILEX_SESSION_SECRET

# Confinement (upstream/README.md). node, from their image; pnpm keeps state in HOME.
USER     = 1000:1000
WRITABLE = /home/node
ENV = HOME=/home/node

# Silex publishes into hosting/css without making it first.
MKDIR = hosting/css hosting/assets
