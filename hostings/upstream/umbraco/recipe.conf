# Umbraco, a .NET CMS. https://github.com/umbraco/Umbraco-CMS
#
# A puzzle piece: the format is in upstream/README.md. Versions come from the
# Umbraco.Templates package on NuGet; its GitHub tags are not plain x.y.z.
# Installs itself on first start from the settings below.

UPSTREAM       = https://github.com/umbraco/Umbraco-CMS.git
RELEASE_RULE   = nuget
PACKAGE        = Umbraco.Templates
SOURCE         = recipe
CONTAINER_PORT = 8080
HEALTH_PATH    = /
HEALTH_WAIT    = 300

MOUNT = data:/app/umbraco/Data
MOUNT = media:/app/wwwroot/media
MOUNT = views:/app/Views

ENV = ConnectionStrings__umbracoDbDSN=Data Source=/app/umbraco/Data/Umbraco.sqlite.db;Cache=Shared;Foreign Keys=True;Pooling=True
ENV = ConnectionStrings__umbracoDbDSN_ProviderName=Microsoft.Data.Sqlite
ENV = Umbraco__CMS__Unattended__InstallUnattended=true
ENV = Umbraco__CMS__Unattended__UnattendedUserName=Admin
ENV = Umbraco__CMS__Unattended__UnattendedUserEmail=admin@{PUBLIC_HOST}
ENV = Umbraco__CMS__WebRouting__UmbracoApplicationUrl={PUBLIC_URL}
# Off, or its login (OpenIddict) refuses the plain-HTTP preview port. The public
# address is HTTPS through Apache either way.
ENV = Umbraco__CMS__Global__UseHttps=false

# The Admin password. sudo cat /etc/upstream/app-<row><suffix>.env
SECRET = Umbraco__CMS__Unattended__UnattendedUserPassword
# No SECRET_UNTIL: InstallUnattended=true checks the password on every boot,
# so Umbraco refuses to start without it (2026-10-07).

# Confinement (upstream/README.md). A uid no host account has; it owns the
# mounts, and the log folder is in memory and open to it.
USER     = 10004:10004
WRITABLE = /app/umbraco/Logs:mode=1777

# The Admin account goes into the secret store as a login: <SECRET> <username>.
LOGIN = Umbraco__CMS__Unattended__UnattendedUserPassword admin@{PUBLIC_HOST}
