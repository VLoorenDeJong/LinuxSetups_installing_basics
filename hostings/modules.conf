# The hosting stack's modules, read by install_hostings.sh.
#
#   module   | <id> | <name> | <row types in hostings.conf that need it>
#   requires | <id> | <ids>             installed with <id>, whether ticked or not
#   conf     | <id> | <keys>            settings that must be filled in for <id>
#   step     | <id> | <script>[:<arg>]  run in this order, when <id> is chosen
#
# A module that rows need is ticked and locked at the prompt: delete the rows
# first to drop it. Scripts are looked up in hostings/scripts/, then in
# install_scripts/. A step two modules list runs once.

