<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<!--
  Generic sign-in page for mod_auth_form. Plain on purpose: a config repo is
  expected to drop its own branded copy over this one, and a shared default that
  already looks like somebody's site is harder to replace than one that does not.

  Three things here are load bearing and must survive any redesign:

    action="/do-login"          the handler the vhost sets up
    name="httpd_username"       what mod_auth_form reads the username from
    name="httpd_password"       and the password

  Rename any of those and the form posts into a void: the browser sends it, the
  handler finds nothing, and the user is returned to this page with no error.
  It reads exactly like a wrong password.

  Images and stylesheets must be referenced under /auth-assets/, never with a
  relative path. This page is served at /login.html while everything else on the
  host is proxied to an application, so a relative src resolves to a path the
  application has never heard of.
-->
<style>
:root { --bg:#101418; --card:#191f26; --line:#2b333d; --text:#e6ebf1; --muted:#8b98a8; --accent:#5b8def; }
@media (prefers-color-scheme: light) {
  :root { --bg:#f2f4f7; --card:#ffffff; --line:#d9dee6; --text:#141c25; --muted:#5a6674; --accent:#2f5d86; }
}
* { box-sizing:border-box; }
body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem; }
.card { background:var(--card); border:1px solid var(--line); padding:2rem; border-radius:10px; width:min(21rem,100%); }
h1 { font-size:1.15rem; margin:0 0 .25rem; text-align:center; }
.sub { color:var(--muted); font-size:.85rem; text-align:center; margin:0 0 1.5rem; }
label { display:block; font-size:.8rem; color:var(--muted); margin:.9rem 0 .3rem; }
input { width:100%; padding:.55rem .7rem; background:var(--bg); border:1px solid var(--line); border-radius:5px; color:var(--text); font-size:1rem; }
input:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent); }
button { width:100%; margin-top:1.5rem; padding:.65rem; border:0; border-radius:5px; background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
button:hover { filter:brightness(1.08); }
button:focus-visible { outline:2px solid var(--text); outline-offset:2px; }
</style>
</head>
<body>
<div class="card">
<h1>Sign in</h1>
<p class="sub">This area is not public.</p>
<form method="POST" action="/do-login">
<label for="u">Username</label>
<input id="u" type="text" name="httpd_username" autocomplete="username" autofocus>
<label for="p">Password</label>
<input id="p" type="password" name="httpd_password" autocomplete="current-password">
<button type="submit">Sign in</button>
</form>
</div>
</body>
</html>
