<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEST | Sign in</title>
<!--
  Sign-in page for a NON-LIVE environment.
  See login.html for the field names that must not change.

  Why this file exists at all, rather than a colour difference on the live page:
  the login page is the first thing anyone sees, so it is the only place where
  saying "this is not the real site" arrives before somebody has done something
  they meant to do for real. A banner further into the application is read
  afterwards.

  Copy this per environment: login-<env>.html. The vhost generator refuses to
  publish a non-live environment whose page is missing, because a vhost pointing
  at a 404 reads as a broken site rather than a missing file.
-->
<style>
:root { --bg:#101418; --card:#191f26; --line:#2b333d; --text:#e6ebf1; --muted:#8b98a8; --warn:#e0a83c; --warn-ink:#2b2213; }
@media (prefers-color-scheme: light) {
  :root { --bg:#f2f4f7; --card:#ffffff; --line:#d9dee6; --text:#141c25; --muted:#5a6674; --warn:#9c6407; --warn-ink:#ffffff; }
}
* { box-sizing:border-box; }
body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem; }
/* Full width, above everything: seen before the card is read. */
.stripe { position:fixed; top:0; left:0; right:0; background:var(--warn); color:var(--warn-ink); text-align:center; padding:.55rem 1rem; font-size:.85rem; font-weight:600; }
.card { background:var(--card); border:1px solid var(--line); padding:2rem; border-radius:10px; width:min(21rem,100%); margin-top:2.5rem; }
h1 { font-size:1.15rem; margin:0 0 .25rem; text-align:center; }
.sub { color:var(--muted); font-size:.85rem; text-align:center; margin:0 0 1rem; }
.notice { background:rgba(224,168,60,.12); border:1px solid rgba(224,168,60,.45); border-radius:6px; padding:.7rem .8rem; font-size:.8rem; line-height:1.45; margin:0 0 1rem; }
label { display:block; font-size:.8rem; color:var(--muted); margin:.9rem 0 .3rem; }
input { width:100%; padding:.55rem .7rem; background:var(--bg); border:1px solid var(--line); border-radius:5px; color:var(--text); font-size:1rem; }
input:focus { outline:2px solid var(--warn); outline-offset:-1px; border-color:var(--warn); }
button { width:100%; margin-top:1.5rem; padding:.65rem; border:0; border-radius:5px; background:var(--warn); color:var(--warn-ink); font-size:1rem; font-weight:600; cursor:pointer; }
button:hover { filter:brightness(1.08); }
button:focus-visible { outline:2px solid var(--text); outline-offset:2px; }
</style>
</head>
<body>
<div class="stripe">TEST ENVIRONMENT &mdash; not the real site</div>
<div class="card">
<h1>Sign in &mdash; test</h1>
<p class="sub">This area is not public.</p>
<p class="notice">
This is a copy used for trying things out. Anything you change here does not
reach the real site, and the data may be replaced or wiped without warning.
Use the same username and password as usual.
</p>
<form method="POST" action="/do-login">
<label for="u">Username</label>
<input id="u" type="text" name="httpd_username" autocomplete="username" autofocus>
<label for="p">Password</label>
<input id="p" type="password" name="httpd_password" autocomplete="current-password">
<button type="submit">Sign in to TEST environment</button>
</form>
</div>
</body>
</html>
